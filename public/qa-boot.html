<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>QA boot</title>
    <script>
      try {
        const state = {
          v: 1,
          choice: "rejected",
          categories: { essential: true, analytics: false, marketing: false, functional: false },
          at: new Date().toISOString(),
        };
        localStorage.setItem("bw:consent:v1", JSON.stringify(state));
        document.cookie =
          "bw_consent=" +
          encodeURIComponent(JSON.stringify({ c: "rejected", a: false })) +
          "; path=/; max-age=15552000; samesite=lax";
        sessionStorage.setItem("dev_modal_dismissed", "true");
      } catch (e) {}
      const to = new URLSearchParams(location.search).get("to") || "/";
      location.replace(to);
    </script>
  </head>
  <body></body>
</html>
